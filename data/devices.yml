# OpenCollar device inventory. Hand-maintained; see scripts/schemas/devices.schema.json.
# id is used in repositories.yml and tools.yml. confidence marks how well the entry is verified
# against firmware source, repositories and the wiki (high | medium | low). Low renders a badge.
devices:
  - id: rangeredge
    display_name: RangerEdge
    family: rangeredge
    status: current
    availability: catalog
    summary: Medium-sized rechargeable GPS tracker with LoRaWAN, for vehicles, rangers, camera traps and other assets.
    use_cases: [vehicle tracking, ranger tracking, camera trap monitoring, tourist safety]
    firmware:
      board: rangeredge_nrf52840
      tracker_type: rangeredge_tracker
      tracker_type_value: 5
      hardware_revisions: ["1.4.0-1.5.0", "1.6.0", "1.7.0", "1.8.0-1.13.0"]
      special_builds: [rangeredge_airq_nrf52840]
    positioning: [u-blox GNSS, LR11xx GNSS, Wi-Fi scan, BLE scan]
    connectivity: [LoRaWAN, BLE, Iridium (optional RockBLOCK), VHF (optional)]
    sensors: [accelerometer, temperature, reed switch, microphone, external switch port, fence port]
    power: { type: rechargeable, batteries: "2x 18650 Li-ion", capacity_ah: 5.7, charging: [DC 5-30 V, solar] }
    physical: { dimensions_mm: [106, 72, 41], weight_g: 220, enclosure: "PA6 glass-fibre injection moulded" }
    repositories:
      docs: smartparks-rangeredge-master
      hardware: [smartparks-rangeredge-hardware]
      mechanics: [smartparks-rangeredge-mechanics]
    tools: { configure: [ble-settings-app, connect-app], decode: [raw-logs-decoder] }
    image: https://raw.githubusercontent.com/SmartParksOrg/smartparks-rangeredge-master/main/pics/rangeredge-assembly-12.jpg
    external_links:
      wiki: https://wiki.smartparks.org/devices/opencollar/rangeredge
      datasheet: https://wiki.smartparks.org/devices/opencollar/rangeredge/datasheet
      catalog: https://www.smartparks.org/product/rangeredge/
    variants: []
    based_on: null
    confidence: high
    notes: The RangerEdge board is also the electronics of TrapEdge, FenceEdge, WisentEdge, ElephantEdge and ScannerEdge.

