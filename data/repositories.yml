# OpenCollar repository index. Hand-maintained. Release data is fetched separately into data/generated/releases.json.
# Fields: name (GitHub name), display_name, category (firmware|device-docs|hardware|mechanics|tool|decoder|integration|platform|archive|hub),
# status (current|maintained|legacy|experimental|archived|private), visibility, description, license (SPDX or none), default_branch,
# devices (ids from devices.yml), audience (user|developer|hardware), links, releases.track, related, notes.
